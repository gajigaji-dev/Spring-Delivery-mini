<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delivery mini — 주문부터 정산까지 한 흐름으로</title>
    <meta
      name="description"
      content="Delivery mini는 고객의 주문·결제부터 사장님의 실시간 주문 처리와 날짜별 정산까지 한 흐름으로 연결하는 배달 주문 서비스입니다."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Open Graph 기본값 — 공유 미리보기 이미지는 아직 없어 og:image는 넣지 않음 (배포 도메인이 정해지면 og:url과 함께 추가) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Delivery mini" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="Delivery mini — 주문부터 정산까지 한 흐름으로" />
    <meta
      property="og:description"
      content="고객은 몇 번의 탭으로 주문하고, 사장님은 새 주문을 바로 받고 입금 예정 금액까지 한 화면에서 확인합니다."
    />
    <meta name="theme-color" content="#F6F4EF" />
    <!-- 웹폰트는 main.tsx에서 사용 굵기만 직접 호스팅(@fontsource) → 외부 CSS 요청 없음 -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
