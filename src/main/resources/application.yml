spring:
  application:
    name: delivery

  # 프로필 — local(기본, 개발 PC에서 직접 실행) / dev(docker-compose) / test(테스트, src/test/resources)
  # 프로필을 지정하지 않으면 local로 실행. 프로필별 설정은 application-{프로필}.yml
  profiles:
    default: local

  # DB 연결 — URL은 프로필별 파일에서 지정, 계정은 환경변수로만 받음 (코드·설정 파일에 계정을 두지 않기 위해)
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # 커넥션 풀·DB 타임아웃 — 기다림에 상한을 둬 한 요청의 지연이 요청 스레드 전체로 번지지 않게 함 (docs/operations.md 6장)
    hikari:
      # 풀 크기: Hikari 기본값(10)을 명시. 인스턴스 수 × 이 값이 PostgreSQL max_connections(기본 100)를 넘지 않아야 함
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # 풀이 바닥났을 때 커넥션을 기다리는 시간 (기본 30초) — 아래 lock_timeout(5초)보다 길게 둬 잠금 대기 중인 요청이 먼저 정리되도록
      connection-timeout: 10000
      # 세션 타임아웃 — 접속할 때 PostgreSQL에 전달 (pgjdbc options), 풀의 모든 커넥션에 적용
      #   lock_timeout: 행 잠금(SELECT ... FOR UPDATE 등)을 기다리는 최대 시간. 넘으면 그 문장만 실패 → 503 (GlobalExceptionHandler)
      #     지정하지 않으면 무제한 대기 → 긴 트랜잭션 하나가 같은 주문·매장을 건드리는 요청을 모두 붙잡음
      #   statement_timeout: 문장 1개의 최대 실행 시간 (잠금 대기 포함). 트랜잭션 전체 시간이 아님
      # Flyway도 같은 풀을 쓰므로 마이그레이션 문장에도 적용됨
      #   → 오래 걸리는 마이그레이션(큰 테이블 인덱스·백필)은 그 파일 안에서 SET LOCAL statement_timeout = 0 (docs/database.md)
      data-source-properties:
        options: "-c lock_timeout=${DB_LOCK_TIMEOUT:5s} -c statement_timeout=${DB_STATEMENT_TIMEOUT:30s}"

  # Redis — 결제 멱등성 키·스케줄러 분산 락 (#41). 접속 주소는 환경변수(기본 localhost:6379)
  # timeout을 짧게 두는 이유: Lettuce 기본 명령 타임아웃(60초) 동안 결제 요청이 멈춰 있지 않도록
  #   → 장애·지연 시 빨리 503(결제) / 실행 건너뜀(스케줄러)으로 끝냄
  # 연결은 처음 명령을 보낼 때 맺으므로 Redis가 없어도 애플리케이션은 기동됨
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s

  # Kafka — Outbox 이벤트 발행·알림 Consumer (#42, docs/architecture.md Kafka 장)
  # 접속 주소는 환경변수(기본 localhost:9094 = docker-compose kafka의 호스트용 리스너)
  # Kafka에 접속하지 못해도 애플리케이션은 기동되고 결제 등 업무 처리는 그대로 됨 (이벤트는 outbox_events에 쌓였다가 회복 후 발행)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      # 모든 복제본 저장 확인 후 성공 + 프로듀서 멱등성(재전송으로 인한 브로커 중복 저장 방지)
      acks: all
      properties:
        enable.idempotence: true
        # 기본값(60초·2분) 대신 짧게: Kafka 장애 시 발행 batch가 행 잠금을 오래 쥐지 않고 빨리 실패 기록 → 백오프 재시도
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      # 그룹이 처음 붙을 때 토픽 처음부터 읽음 → Consumer가 늦게 떠도 그 사이 발행된 이벤트를 놓치지 않음
      auto-offset-reset: earliest
    admin:
      # 기동 시 토픽 확인·생성 대기 시간 (기본 30초) — Kafka 장애 때 기동이 오래 멈추지 않도록
      operation-timeout: 5s

  # JPA
  jpa:
    # 기본 open-in-view 등록은 끄고 config.OpenEntityManagerInViewConfig에서 SSE 경로만 빼고 다시 등록 (#76)
    # (다른 API의 동작은 그대로, 오래 열린 SSE 응답이 DB 커넥션을 잡고 있지 않도록)
    open-in-view: false
    hibernate:
      # 스키마 변경은 Flyway(db/migration)만 담당, Hibernate는 엔티티와 테이블이 맞는지 검사만 함
      # 맞지 않으면 기동 실패 → 엔티티를 바꿨다면 마이그레이션 파일도 함께 추가
      ddl-auto: validate
    properties:
      hibernate:
        # hibernate.jdbc.time_zone은 일부러 지정하지 않음
        #   지정하면 JVM 시간대와 다를 때 LocalDateTime을 저장하면서 시간대 변환이 한 번 더 일어나 값이 밀림
        #   (예: JVM UTC + time_zone Asia/Seoul → 23:59가 다음 날 08:59로 저장, TimeZoneIntegrationTest로 확인)
        #   지정하지 않으면 LocalDateTime은 변환 없이 그대로 저장됨 → 기준 시간대는 TimeConfig(Clock)에서만 관리

  # Flyway — 기동 시 src/main/resources/db/migration의 V{버전}__{설명}.sql을 순서대로 실행
  flyway:
    # 이력 테이블(flyway_schema_history) 없이 테이블이 이미 있는 DB(ddl-auto로 만들어진 기존 DB)는
    # V1을 "이미 적용됨"으로 기록하고 V2부터 실행. 빈 DB는 V1부터 실행
    baseline-on-migrate: true
    baseline-version: 1

# 결제 플랫폼 수수료 (공통 수수료율) — config.PaymentFeeProperties
# 매장별 수수료율(stores.fee_rate, 관리자 API로 설정)이 없는 매장에 적용. 결제 시점 값이 payments.fee_rate에 저장됨
# rate: 0 이상 1 이하, 소수점 4자리까지 (0.05 = 5%, 실제 계약 요율이 아닌 임시 통일 값). 범위를 벗어나면 기동 실패
# 계산·반올림 정책은 entity.PaymentFee 참고 (수수료 원 단위 HALF_UP, 정산액 = 결제액 - 수수료)
payment:
  fee:
    rate: "0.05" # 문자열로 지정 → double을 거치지 않고 BigDecimal로 그대로 바인딩
  # 결제 멱등성(Idempotency-Key 헤더) 기록 보관 시간 — config.PaymentIdempotencyProperties
  # processing-ttl: 처리 중 기록 유지 시간 (결제 1건 처리 시간보다 넉넉하게, 서버가 처리 중 죽으면 이 시간 뒤 재시도 가능)
  # completed-ttl: 완료 응답 보관 시간 (이 시간 안의 같은 키 재시도는 처음 응답을 그대로 받음)
  idempotency:
    processing-ttl: 1m
    completed-ttl: 24h

# 토스페이먼츠 테스트 모드 결제 (V20) — config.TossPaymentsProperties, pg.TossPaymentsClient, docs/api.md 토스페이먼츠 결제 장
# mode: real(기본) | fake — fake는 키 없이 가짜 결제창(/payments/fake-toss)으로 흐름 전체를 시연 (pg.FakeTossPaymentsClient)
# client-key·secret-key: 기본값 없음, TOSS_CLIENT_KEY·TOSS_SECRET_KEY 환경변수로만 (공식 문서의 공개 테스트 키, test_ck_·test_sk_만 허용)
#   둘 다 없으면 토스 결제를 끔 → 화면은 모의 결제(POST /api/payments)를 보여 줌
# 시간 초과: confirm-timeout + query-timeout(+ 연결)이 payment.idempotency.processing-ttl(1m)보다 짧아야 함
#   승인 결과를 모르면(시간 초과) 조회로 확인하고, 그래도 모르면 503 PG_RESULT_UNKNOWN → 같은 승인 요청 재시도(토스 멱등 키로 승인은 한 번)
# cancel: 취소 요청(pg_cancel_requests) 주기 재시도 — 커밋 직후 1회 시도 후 실패분만
#   재시도 간격 = min(initial-backoff × 2^(실패 횟수-1), max-backoff) → 10s, 20s, 40s ... 최대 10분, max-attempts번 실패하면 FAILED
#   lease: 작업자가 행을 가져간 뒤 다른 작업자가 가져가지 못하는 시간 (connect + cancel-timeout보다 길어야 함)
toss:
  payments:
    # real: 토스 테스트 서버(테스트 키, 실제 돈 없음) / fake: 토스에 접속하지 않는 가짜 PG — 오프라인 데모·장애 재현, prod 불가 (V21)
    mode: ${TOSS_MODE:real}
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
    base-url: https://api.tosspayments.com
    connect-timeout: 3s
    confirm-timeout: 15s
    query-timeout: 5s
    cancel-timeout: 15s
    cancel:
      enabled: true
      fixed-delay: 10s
      batch-size: 20
      max-attempts: 10
      initial-backoff: 10s
      max-backoff: 10m
      lease: 1m

# 일 정산 자동 확정 — scheduler.SettlementScheduler
# enabled: false면 스케줄 실행 안 함 (config.SchedulingConfig)
# cron: 초 분 시 일 월 요일, Asia/Seoul 기준. D일은 D+1 01:00에 확정 가능 → 10분 여유를 두고 01:10
# catch-up-days: 실행할 때마다 최근 N일을 확정 (실행을 놓친 날 보충, 이미 확정된 날은 건너뜀)
# lock-at-most-for / lock-at-least-for: 여러 서버 중 한 대만 실행하는 Redis 분산 락 (#41, lock.RedisDistributedLock)
#   at-most: 락 최대 유지 시간 — 서버가 실행 중 죽어도 이 시간 뒤 풀림. 집계 최대 실행 시간보다 넉넉하게
#   at-least: 빨리 끝나도 이 시간까지 락 유지 — 시계가 늦은 서버가 끝난 작업을 다시 실행하지 않도록
settlement:
  scheduler:
    enabled: true
    cron: "0 10 1 * * *"
    catch-up-days: 7
    lock-at-most-for: 30m
    lock-at-least-for: 5m

# Transactional Outbox (#42) — config.OutboxProperties, docs/architecture.md Kafka 장
# topic: 업무 이벤트 토픽 (DLT는 {topic}-dlt). 파티션 수는 config.KafkaConfig
# publisher: outbox_events → Kafka 발행 (event.OutboxPublisher / OutboxPublishScheduler)
#   enabled: false면 이 인스턴스는 발행하지 않음 (이벤트 저장은 계속, 여러 인스턴스가 켜져 있어도 SKIP LOCKED로 나눠 발행)
#   fixed-delay: 발행 주기 / batch-size: 한 번에 발행하는 최대 건수 / send-timeout: batch 발행 결과 대기 시간
#   max-attempts: 이 횟수만큼 실패하면 FAILED (자동 재시도 중단, 운영자 확인 대상)
#   재시도 간격 = min(initial-backoff × 2^(실패 횟수-1), max-backoff) → 1s, 2s, 4s ... 최대 5분 (10번이면 약 13분간 재시도)
# consumer: 알림 Consumer 처리 실패 시 retry-interval 간격으로 retry-attempts번 재시도 후 DLT
outbox:
  topic: delivery-events
  publisher:
    enabled: true
    fixed-delay: 1s
    batch-size: 100
    send-timeout: 10s
    max-attempts: 10
    initial-backoff: 1s
    max-backoff: 5m
  consumer:
    retry-attempts: 3
    retry-interval: 1s

# 알림 발송 (V14) — config.NotificationProperties, event.NotificationDispatcher
# 알림 기록(notifications)의 PENDING 행을 읽어 발송기(event.NotificationSender, 기본은 로그 출력)로 보냄
#   enabled: false면 이 인스턴스는 발송하지 않음 (기록 저장은 계속, 여러 인스턴스가 켜져 있어도 SKIP LOCKED로 나눠 발송)
#   fixed-delay: 발송 주기 / batch-size: 한 번에 발송하는 최대 건수
#   max-attempts: 이 횟수만큼 실패하면 FAILED (자동 발송 중단) / retry-delay: 실패 후 재시도 간격
#   sender: 발송 채널 — log(기본, 로그 출력) / slack(운영 채널 1곳으로 Incoming Webhook 발송, #69)
#   slack.webhook-url: 기본값 없음, SLACK_WEBHOOK_URL 환경변수로만 주입 (URL 자체가 발송 권한 → 설정 파일·저장소에 두지 않음)
#   slack.connect-timeout / read-timeout: 발송은 알림 행을 잠근 트랜잭션 안에서 하므로 짧게 (Slack 응답은 보통 1초 이내)
notification:
  sender: ${NOTIFICATION_SENDER:log}
  dispatcher:
    enabled: true
    fixed-delay: 5s
    batch-size: 100
    max-attempts: 5
    retry-delay: 1m
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
    connect-timeout: 2s
    read-timeout: 3s

# 보관 기간이 지난 기록 정리 (V14) — config.RetentionProperties, maintenance.RetentionCleaner
#   enabled: false면 이 인스턴스는 정리하지 않음 / fixed-delay: 정리 주기
#   batch-size: DELETE 한 번에 지우는 행 수 / max-batches-per-run: 한 주기에 테이블당 DELETE 횟수 (주기당 최대 10만 행)
#   outbox-published: 발행 완료(PUBLISHED) 이벤트 보관 기간 — PENDING·FAILED는 지우지 않음
#   consumed-events: Consumer 처리 기록 보관 기간 — Kafka 토픽 보관 기간(기본 7일)보다 길어야 재전달된 메시지를 중복으로 걸러냄
#   payment-idempotency-keys: DB 결제 멱등성 기록 보관 기간 — 지난 뒤 같은 키 재시도는 처음 응답 대신 409(이미 결제됨)
# 사장님 실시간 주문 알림(SSE, #76) — config.OwnerStreamProperties, docs/architecture.md 실시간 알림 장
# 연결은 이 서버 메모리에만 보관(단일 인스턴스 기준). timeout은 Access Token(15분)보다 짧게 → 재연결 때 권한 재확인
owner-stream:
  timeout: 10m
  heartbeat: 25s
  max-connections-per-user: 5
  send-queue-capacity: 1000

retention:
  enabled: true
  fixed-delay: 1h
  batch-size: 1000
  max-batches-per-run: 100
  outbox-published: 7d
  consumed-events: 30d
  payment-idempotency-keys: 30d
  # 만료된 Refresh Token 행 — 만료(expires_at) 후 이 기간이 지나면 삭제 (V16). 만료된 토큰은 어차피 재발급에 못 쓰므로
  # 기간은 문의·감사 확인용 여유. 지운 토큰이 다시 오면 "모르는 값"(REFRESH_TOKEN_INVALID)으로 거부됨
  refresh-tokens: 7d

# CORS — 브라우저(프론트엔드)에서 API를 호출할 수 있는 출처 (config.CorsProperties, SecurityConfig, docs/operations.md 7장)
# 환경변수 CORS_ALLOWED_ORIGINS에 쉼표로 구분해 지정 (scheme://host[:port], 와일드카드·경로·끝 슬래시 불가 → 기동 실패)
# 기본값은 빈 목록 = 다른 출처의 브라우저 요청을 모두 막음. local·dev는 로컬 프론트엔드 개발 서버 주소를 기본값으로 둠
# prod는 기본값 없이 환경변수 필수 (없으면 config.ProdProfileGuard가 기동을 막음)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# JWT — secret은 Base64 인코딩된 256비트 이상 키, JWT_SECRET 환경변수로만 주입
# 기본값을 두지 않음: 저장소에 공개된 키로 운영 토큰이 서명되는 일을 막기 위해, 값이 없으면 기동 실패
# 테스트는 src/test/resources/application-test.yml의 테스트 전용 키 사용
jwt:
  secret: ${JWT_SECRET}
  # Access Token 수명 15분 (V16, 이전 1시간) — 서명만 검증하는 방식이라 로그아웃해도 만료까지는 유효하므로
  # 노출 시간을 짧게 둠. 요청마다 DB·Redis 확인 없이 끝나는 장점은 유지 (docs/architecture.md 인증 장)
  expiration-ms: 900000

# Refresh Token — config.RefreshTokenProperties, service.AuthTokenService (docs/architecture.md 인증 장)
#   DB(refresh_tokens)에 해시만 저장, 브라우저에는 HttpOnly 쿠키(refresh_token, Path=/api/users)로 전달
#   ttl: 수명. 재발급할 때마다 그 시점부터 다시 ttl (ttl 동안 한 번도 재발급하지 않으면 재로그인)
#   absolute-ttl: 로그인 시점부터 최대 수명 (V16) — 계속 재발급해도 이 기간이 지나면 재로그인
#   cookie-secure: HTTPS에서만 전송 (localhost는 브라우저가 http에서도 허용)
#   cookie-same-site: 프론트엔드와 API가 다른 사이트(등록 도메인이 다름)에 배포되면 None 필요 (None이면 secure 필수)
auth:
  refresh-token:
    ttl: 14d
    absolute-ttl: 30d
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:true}
    cookie-same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Strict}

# 로그 — 모든 로그 줄에 요청별 traceId(logging.TraceIdFilter가 MDC에 넣은 값)를 출력
# 요청 밖(스케줄러 등)에서는 빈 값. 응답 헤더 X-Trace-Id·에러 응답 traceId와 같은 값으로 로그를 찾을 수 있음
logging:
  pattern:
    correlation: "[%X{traceId:-}] "

# Actuator — 기본값은 운영 기준으로 최소 노출: 헬스체크만, 상세(DB 상태 등) 없이 UP/DOWN만
# 메트릭(prometheus)은 local·dev 프로필에서만 노출 (application-local.yml, application-dev.yml)
# 노출된 엔드포인트의 접근 권한은 SecurityConfig (health·prometheus는 공개, 나머지는 ADMIN)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # Redis 헬스체크는 끔: Redis 장애 때도 키 없는 결제·조회 등 나머지 API는 정상이므로
  # 헬스체크가 DOWN이 되어 인스턴스 전체가 트래픽에서 빠지거나 재시작되지 않도록 (Redis 장애는 로그·503으로 드러남)
  health:
    redis:
      enabled: false

# API 문서(springdoc) — 기본 비활성: 운영에서 API 구조가 공개되지 않도록 local·dev 프로필에서만 켬
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
