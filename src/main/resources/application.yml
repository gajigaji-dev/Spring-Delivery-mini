spring:
  application:
    name: delivery

  # 프로필 — local(기본, 개발 PC에서 직접 실행) / dev(docker-compose) / test(테스트, src/test/resources)
  # 프로필을 지정하지 않으면 local로 실행. 프로필별 설정은 application-{프로필}.yml
  profiles:
    default: local

  # DB 연결 — URL은 프로필별 파일에서 지정, 계정은 환경변수로만 받음 (코드·설정 파일에 계정을 두지 않기 위해)
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Redis — 결제 멱등성 키·스케줄러 분산 락 (#41). 접속 주소는 환경변수(기본 localhost:6379)
  # timeout을 짧게 두는 이유: Lettuce 기본 명령 타임아웃(60초) 동안 결제 요청이 멈춰 있지 않도록
  #   → 장애·지연 시 빨리 503(결제) / 실행 건너뜀(스케줄러)으로 끝냄
  # 연결은 처음 명령을 보낼 때 맺으므로 Redis가 없어도 애플리케이션은 기동됨
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s

  # JPA
  jpa:
    hibernate:
      # 스키마 변경은 Flyway(db/migration)만 담당, Hibernate는 엔티티와 테이블이 맞는지 검사만 함
      # 맞지 않으면 기동 실패 → 엔티티를 바꿨다면 마이그레이션 파일도 함께 추가
      ddl-auto: validate
    properties:
      hibernate:
        # hibernate.jdbc.time_zone은 일부러 지정하지 않음
        #   지정하면 JVM 시간대와 다를 때 LocalDateTime을 저장하면서 시간대 변환이 한 번 더 일어나 값이 밀림
        #   (예: JVM UTC + time_zone Asia/Seoul → 23:59가 다음 날 08:59로 저장, TimeZoneIntegrationTest로 확인)
        #   지정하지 않으면 LocalDateTime은 변환 없이 그대로 저장됨 → 기준 시간대는 TimeConfig(Clock)에서만 관리

  # Flyway — 기동 시 src/main/resources/db/migration의 V{버전}__{설명}.sql을 순서대로 실행
  flyway:
    # 이력 테이블(flyway_schema_history) 없이 테이블이 이미 있는 DB(ddl-auto로 만들어진 기존 DB)는
    # V1을 "이미 적용됨"으로 기록하고 V2부터 실행. 빈 DB는 V1부터 실행
    baseline-on-migrate: true
    baseline-version: 1

# 결제 플랫폼 수수료 (공통 수수료율) — config.PaymentFeeProperties
# 매장별 수수료율(stores.fee_rate, 관리자 API로 설정)이 없는 매장에 적용. 결제 시점 값이 payments.fee_rate에 저장됨
# rate: 0 이상 1 이하, 소수점 4자리까지 (0.05 = 5%, 실제 계약 요율이 아닌 임시 통일 값). 범위를 벗어나면 기동 실패
# 계산·반올림 정책은 entity.PaymentFee 참고 (수수료 원 단위 HALF_UP, 정산액 = 결제액 - 수수료)
payment:
  fee:
    rate: "0.05" # 문자열로 지정 → double을 거치지 않고 BigDecimal로 그대로 바인딩
  # 결제 멱등성(Idempotency-Key 헤더) 기록 보관 시간 — config.PaymentIdempotencyProperties
  # processing-ttl: 처리 중 기록 유지 시간 (결제 1건 처리 시간보다 넉넉하게, 서버가 처리 중 죽으면 이 시간 뒤 재시도 가능)
  # completed-ttl: 완료 응답 보관 시간 (이 시간 안의 같은 키 재시도는 처음 응답을 그대로 받음)
  idempotency:
    processing-ttl: 1m
    completed-ttl: 24h

# 일 정산 자동 확정 — scheduler.SettlementScheduler
# enabled: false면 스케줄 실행 안 함 (config.SchedulingConfig)
# cron: 초 분 시 일 월 요일, Asia/Seoul 기준. D일은 D+1 01:00에 확정 가능 → 10분 여유를 두고 01:10
# catch-up-days: 실행할 때마다 최근 N일을 확정 (실행을 놓친 날 보충, 이미 확정된 날은 건너뜀)
# lock-at-most-for / lock-at-least-for: 여러 서버 중 한 대만 실행하는 Redis 분산 락 (#41, lock.RedisDistributedLock)
#   at-most: 락 최대 유지 시간 — 서버가 실행 중 죽어도 이 시간 뒤 풀림. 집계 최대 실행 시간보다 넉넉하게
#   at-least: 빨리 끝나도 이 시간까지 락 유지 — 시계가 늦은 서버가 끝난 작업을 다시 실행하지 않도록
settlement:
  scheduler:
    enabled: true
    cron: "0 10 1 * * *"
    catch-up-days: 7
    lock-at-most-for: 30m
    lock-at-least-for: 5m

# JWT — secret은 Base64 인코딩된 256비트 이상 키, JWT_SECRET 환경변수로만 주입
# 기본값을 두지 않음: 저장소에 공개된 키로 운영 토큰이 서명되는 일을 막기 위해, 값이 없으면 기동 실패
# 테스트는 src/test/resources/application-test.yml의 테스트 전용 키 사용
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000  # 1시간

# 로그 — 모든 로그 줄에 요청별 traceId(logging.TraceIdFilter가 MDC에 넣은 값)를 출력
# 요청 밖(스케줄러 등)에서는 빈 값. 응답 헤더 X-Trace-Id·에러 응답 traceId와 같은 값으로 로그를 찾을 수 있음
logging:
  pattern:
    correlation: "[%X{traceId:-}] "

# Actuator — 기본값은 운영 기준으로 최소 노출: 헬스체크만, 상세(DB 상태 등) 없이 UP/DOWN만
# 메트릭(prometheus)은 local·dev 프로필에서만 노출 (application-local.yml, application-dev.yml)
# 노출된 엔드포인트의 접근 권한은 SecurityConfig (health·prometheus는 공개, 나머지는 ADMIN)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  # Redis 헬스체크는 끔: Redis 장애 때도 키 없는 결제·조회 등 나머지 API는 정상이므로
  # 헬스체크가 DOWN이 되어 인스턴스 전체가 트래픽에서 빠지거나 재시작되지 않도록 (Redis 장애는 로그·503으로 드러남)
  health:
    redis:
      enabled: false

# API 문서(springdoc) — 기본 비활성: 운영에서 API 구조가 공개되지 않도록 local·dev 프로필에서만 켬
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
