spring:
  application:
    name: delivery

  # DB 연결 — 3-3의 docker run 값과 똑같이
  datasource:
    url: jdbc:postgresql://localhost:5432/delivery
    username: ${DB_USERNAME} # 환경변수로 지정
    password: ${DB_PASSWORD}

  # JPA
  jpa:
    hibernate:
      # 스키마 변경은 Flyway(db/migration)만 담당, Hibernate는 엔티티와 테이블이 맞는지 검사만 함
      # 맞지 않으면 기동 실패 → 엔티티를 바꿨다면 마이그레이션 파일도 함께 추가
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # hibernate.jdbc.time_zone은 일부러 지정하지 않음
        #   지정하면 JVM 시간대와 다를 때 LocalDateTime을 저장하면서 시간대 변환이 한 번 더 일어나 값이 밀림
        #   (예: JVM UTC + time_zone Asia/Seoul → 23:59가 다음 날 08:59로 저장, TimeZoneIntegrationTest로 확인)
        #   지정하지 않으면 LocalDateTime은 변환 없이 그대로 저장됨 → 기준 시간대는 TimeConfig(Clock)에서만 관리

  # Flyway — 기동 시 src/main/resources/db/migration의 V{버전}__{설명}.sql을 순서대로 실행
  flyway:
    # 이력 테이블(flyway_schema_history) 없이 테이블이 이미 있는 DB(ddl-auto로 만들어진 기존 DB)는
    # V1을 "이미 적용됨"으로 기록하고 V2부터 실행. 빈 DB는 V1부터 실행
    baseline-on-migrate: true
    baseline-version: 1

# JWT — secret은 Base64 인코딩된 256비트 이상 키. 운영에서는 JWT_SECRET 환경변수로 주입
jwt:
  secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1mb3Itc3ByaW5nLWRlbGl2ZXJ5LW1pbmktand0LTI1NmJpdA==}
  expiration-ms: 3600000  # 1시간